<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Shield — Fraud Detection System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-shield-alt"></i>
            <span>UPI Shield</span>
        </div>
        <ul class="nav-links">
    <li><a href="/" class="{% if request.endpoint == 'home' %}active{% endif %}">Home</a></li>
    <li><a href="/about" class="{% if request.endpoint == 'about' %}active{% endif %}">About</a></li>
    <li><a href="/predict_page" class="{% if request.endpoint == 'predict_page' %}active{% endif %}">Detect Fraud</a></li>
    <li><a href="/dashboard" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a></li>
</ul>
    </nav>
    {% block content %}{% endblock %}
    <footer class="footer">
        <p>UPI Shield — Fraud Detection System &copy; 2026 | Chennai Institute of Technology</p>
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
