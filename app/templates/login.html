{% extends "base.html" %}
{% block content %}

<section style="min-height:90vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at top, #1a1a4e 0%, var(--dark) 70%);">
    <div style="background:var(--card); border:1px solid var(--border); border-radius:24px; padding:3rem; width:100%; max-width:440px;">
        <div style="text-align:center; margin-bottom:2rem;">
            <div style="font-size:2.5rem; margin-bottom:0.5rem;">🛡️</div>
            <h2 style="font-size:1.8rem; font-weight:800; background:linear-gradient(135deg, var(--text), var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Welcome Back</h2>
            <p style="color:var(--text-muted); margin-top:0.3rem;">Login to access UPI Shield</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div style="background:rgba(255,68,68,0.1); border:1px solid var(--danger); border-radius:10px; padding:0.8rem; margin-bottom:1rem; color:var(--danger); font-size:0.9rem;">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="predict-btn" style="margin-top:0.5rem;">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <p style="text-align:center; margin-top:1.5rem; color:var(--text-muted); font-size:0.9rem;">
            Don't have an account? 
            <a href="/signup" style="color:var(--secondary); text-decoration:none; font-weight:600;">Sign Up</a>
        </p>
    </div>
</section>

{% endblock %}
